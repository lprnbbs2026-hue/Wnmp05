<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f1f1f">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Aplikasi Winamp berbasis Webamp dengan pengalaman seperti native app. Sudah siap dijalankan di localhost atau HTTPS.">
    <title>PlayWinamp dengan Webamp</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(255,255,255,0.06);
            --text: #f3f4f6;
            --accent: #fbbf24;
            --vh: 1vh;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            height: 100%;
            background: radial-gradient(circle at top, #182235 0%, var(--bg) 38%, #030712 100%);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: stretch;
            justify-content: center;
            overflow: hidden;
        }

        .app-shell {
            position: relative;
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            padding: 0;
        }

        #winamp-container {
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;
            max-height: 100dvh;
            margin: 0 !important;
            padding: 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #winamp-container > * {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            height: 100dvh !important;
            max-height: 100dvh !important;
            margin: 0 auto !important;
            display: block !important;
        }

        #winamp-container .webamp-app,
        #winamp-container .webamp,
        #winamp-container .webamp-app-container,
        #winamp-container .webamp-viewport {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            height: 100dvh !important;
            max-height: 100dvh !important;
        }

        @supports not (height: 100dvh) {
            .app-shell {
                min-height: 100%;
            }

            #winamp-container,
            #winamp-container > *,
            #winamp-container .webamp-app,
            #winamp-container .webamp,
            #winamp-container .webamp-app-container,
            #winamp-container .webamp-viewport {
                height: calc(var(--vh, 1vh) * 100) !important;
                min-height: calc(var(--vh, 1vh) * 100) !important;
                max-height: calc(var(--vh, 1vh) * 100) !important;
            }
        }

        .native-actions {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .native-actions button {
            appearance: none;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(17, 24, 39, 0.85);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .native-actions button:hover {
            transform: translateY(-1px);
        }

        .native-actions button[hidden] {
            display: none;
        }

        .status {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 40;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e5e7eb;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        @media (max-width: 700px) {
            .native-actions {
                top: 12px;
                right: 12px;
                gap: 8px;
            }

            .native-actions button {
                padding: 8px 12px;
                font-size: 12px;
            }

            .status {
                left: 12px;
                bottom: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="native-actions">
            <button id="install-btn" hidden>Install App</button>
            <button id="fullscreen-btn" type="button">Full Screen</button>
        </div>

        <div id="winamp-container"></div>
        <div class="status" id="status">Memuat demo audio…</div>
    </div>

    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
    <script>
        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', setViewportHeight);

        const DEMO_TRACK = {
            metaData: {
                artist: 'Webamp Demo',
                title: 'Demo Track'
            },
            url: 'https://raw.githubusercontent.com/captbaritone/webamp/master/examples/media/track1.mp3'
        };

        const statusEl = document.getElementById('status');
        const appContainer = document.getElementById('winamp-container');

        const webamp = new Webamp({
            initialTracks: [DEMO_TRACK],
            initialSkin: {
                url: 'https://raw.githubusercontent.com/captbaritone/webamp/master/skins/Topaz.wsz'
            }
        });

        webamp.renderWhenReady(appContainer);

        webamp.onTrackDidChange((track) => {
            if (track && track.metaData) {
                statusEl.textContent = `${track.metaData.artist || 'Unknown'} - ${track.metaData.title || 'Track'}`;
            }
        });

        const forceFullViewport = () => {
            const root = appContainer.querySelector('.webamp-app, .webamp, .webamp-app-container, .webamp-viewport');
            if (root) {
                root.style.width = '100%';
                root.style.maxWidth = '100%';
                root.style.height = '100dvh';
                root.style.maxHeight = '100dvh';
                root.style.margin = '0';
                root.style.padding = '0';
            }

            appContainer.style.width = '100%';
            appContainer.style.height = '100dvh';
            appContainer.style.maxHeight = '100dvh';
            appContainer.style.margin = '0';
            appContainer.style.padding = '0';
        };

        setTimeout(forceFullViewport, 200);
        setTimeout(forceFullViewport, 600);
        setTimeout(forceFullViewport, 1200);
        window.addEventListener('resize', forceFullViewport);

        let deferredPrompt = null;
        const installBtn = document.getElementById('install-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;
            installBtn.hidden = false;
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;

            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('Install prompt result:', outcome);
            deferredPrompt = null;
            installBtn.hidden = true;
        });

        fullscreenBtn.addEventListener('click', async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error('Fullscreen error:', error);
            }
        });

        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(() => console.log('Service worker registered'))
                    .catch((error) => console.error('Service worker registration failed:', error));
            });
        }
    </script>
</body>
</html>
