<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f1f1f">
    <meta name="description" content="Aplikasi Winamp berbasis Webamp dengan fitur PWA">
    <title>PlayWinamp dengan Webamp</title>
    <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
    <div id="winamp-container"></div>

    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
    <script>
        const Webamp = window.Webamp;
        const webamp = new Webamp({
            // initialTracks: [{ metaData: { artist: "Artis", title: "Lagu" }, url: "lagu.mp3" }]
        });

        webamp.renderWhenReady(document.getElementById('winamp-container'));

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(() => console.log('Service worker registered'))
                    .catch((error) => console.error('Service worker registration failed:', error));
            });
        }
    </script>
</body>
</html>
